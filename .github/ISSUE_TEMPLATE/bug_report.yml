name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TETHRA version
      placeholder: e.g. 1.6.1
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map (if related)
      description: Name or link of the beatmap.
  - type: textarea
    id: system
    attributes:
      label: System
      description: Windows version, GPU, screen resolution.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
