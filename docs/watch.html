<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TETHRA</title>
<style>
  html, body { margin: 0; height: 100%; background: #121314; color: #e9e4d8; font: 15px/1.4 system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  video { max-width: 100%; max-height: 82vh; background: #000; border-radius: 4px; }
  a { color: #e89b3c; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <video id="v" controls autoplay playsinline></video>
  <div><a href="https://github.com/Vyrenbusiness-source/TETHRA">TETHRA on GitHub</a> · <a id="dl" href="#">Download video</a></div>
</main>
<script>
  // ?v=<name> plays media/<name>.mp4; only known names are accepted.
  var names = ["trailer", "mania", "orbit", "rally", "dirigent", "trace", "rebound", "sv_mod"];
  var name = new URLSearchParams(location.search).get("v");
  if (names.indexOf(name) < 0) name = "trailer";
  var src = "media/" + name + ".mp4";
  document.getElementById("v").src = src;
  document.getElementById("dl").href = src;
  document.title = "TETHRA · " + name;
</script>
</body>
</html>
